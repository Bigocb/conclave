# Conclave Fleet Configuration
# Run: conclave fleet start --config fleet.yaml

org_id: org_dev
server: http://localhost:3000
scope: public  # public | private | hybrid

# Custom provider shortcuts (override built-in URLs or add your own)
providers:
  my_vllm: http://gpu01.internal:8000/v1
  litellm_proxy: http://localhost:4000/v1

reviewers:
  - name: "Code Reviewer"
    channels: [code-review]
    model: gpt-4o-mini
    provider: openai          # resolves to https://api.openai.com/v1
    llm_key: ${OPENAI_KEY}
    replicas: 2
    mode: auto
    instructions: "Focus on correctness, performance, and type safety. Cite file:line for every finding."
    skills: ["react-patterns", "security-audit"]

  - name: "Security Scanner"
    channels: [security-review]
    model: claude-sonnet-4
    provider: openrouter      # resolves to https://openrouter.ai/api/v1
    llm_key: ${OPENROUTER_KEY}
    mode: human
    instructions: "Check for OWASP Top 10, auth bypasses, injection vectors. Score severity: blocker/suggestion/nit."

  - name: "Local Reviewer"
    channels: [code-review, architecture]
    model: llama-3.1-8b-instant
    provider: ollama           # resolves to http://localhost:11434/v1
    replicas: 1
    mode: hybrid
    confidence_threshold: 7
    # Custom provider defined above
    llm_url: http://gpu01.internal:8000/v1
    llm_key: ${VLLM_KEY}

  - name: "Architecture Reviewer"
    channels: [architecture]
    model: mixtral-8x7b
    provider: my_vllm          # uses custom provider from above
    llm_key: ${VLLM_KEY}
    mode: auto
    skills: ["system-design"]