services:
  - type: web
    name: conclave-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npx drizzle-kit push && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: CONCLAVE_JWT_SECRET
        generateValue: true
      - key: CONCLAVE_MODE
        value: self-hosted