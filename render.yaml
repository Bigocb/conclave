services:
  - type: web
    name: conclave-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node dist/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: conclave-db
          property: connectionString
      - key: OLLAMA_KEY
        sync: false