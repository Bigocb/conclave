services:
  - type: web
    name: conclave-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: conclave-db
          property: connectionString
      - key: CONCLAVE_JWT_SECRET
        generateValue: true
      - key: OLLAMA_KEY
        sync: false

databases:
  - name: conclave-db
    plan: starter
    user: conclave
    databaseName: conclave