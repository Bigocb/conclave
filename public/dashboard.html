<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conclave | Agent Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e5e5; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-field { background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 6px; padding: 8px 12px; width: 100%; }
        .btn-primary { background: #fff; color: #000; font-weight: 600; padding: 8px 16px; border-radius: 6px; transition: all 0.2s; }
        .btn-primary:hover { background: #ccc; }
        .status-active { color: #10b981; }
        .status-decommissioned { color: #ef4444; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">Agent Factory</h1>
                <p class="text-gray-500">Provision and manage your agentic workforce</p>
            </div>
            <button onclick="toggleModal(true)" class="btn-primary">+ Register Agent</button>
        </header>

        <!-- Agents Table -->
        <div class="glass rounded-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-gray-400 text-sm uppercase border-b border-white/10">
                        <th class="p-4 font-medium">Agent Name</th>
                        <th class="p-4 font-medium">Provider/Model</th>
                        <th class="p-4 font-medium">Status</th>
                        <th class="p-4 font-medium">ID</th>
                        <th class="p-4 font-medium text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="agent-list">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>

        <!-- Registration Modal -->
        <div id="modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
            <div class="glass max-w-md w-full p-6 rounded-2xl shadow-2xl">
                <h2 class="text-xl font-bold mb-6">Register New Agent</h2>
                <form id="reg-form" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Agent Name</label>
                        <input type="text" name="name" class="input-field" placeholder="e.g. Researcher-Alpha" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Provider</label>
                            <select name="provider" class="input-field" onchange="handleProviderChange(this.value)">
                                <option value="">None (Custom URL)</option>
                                <option value="openai">OpenAI</option>
                                <option value="anthropic">Anthropic</option>
                                <option value="openrouter">OpenRouter</option>
                                <option value="groq">Groq</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Model</label>
                            <input type="text" name="model" class="input-field" placeholder="gpt-4o">
                        </div>
                    </div>
                    <div id="key-field" class="hidden">
                        <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">API Key</label>
                        <input type="password" name="api_key" class="input-field" placeholder="sk-...">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1 uppercase font-semibold">Principal ID</label>
                        <input type="text" name="principal_id" class="input-field" required>
                    </div>
                    <div class="flex justify-end gap-3 pt-4">
                        <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-gray-400 hover:text-white transition">Cancel</button>
                        <button type="submit" class="btn-primary">Create Agent</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/v1';

        function toggleModal(show) {
            document.getElementById('modal').classList.toggle('hidden', !show);
        }

        function handleProviderChange(val) {
            document.getElementById('key-field').classList.toggle('hidden', !val);
        }

        async function loadAgents() {
            try {
                const res = await fetch(`${API_BASE}/agents`);
                const data = await res.json();
                const list = document.getElementById('agent-list');
                list.innerHTML = '';

                if (!data.success || !data.data) return;

                data.data.forEach(agent => {
                    const row = document.createElement('tr');
                    row.className = 'border-b border-white/5 hover:bg-white/[0.02] transition';
                    row.innerHTML = `
                        <td class="p-4 font-medium">${agent.name}</td>
                        <td class="p-4 text-gray-400 text-sm">${agent.provider || 'custom'}/${agent.model || 'unknown'}</td>
                        <td class="p-4 text-sm ${agent.status === 'active' ? 'status-active' : 'status-decommissioned'}">
                            ${agent.status}
                        </td>
                        <td class="p-4 text-xs text-gray-500 font-mono">${agent.id}</td>
                        <td class="p-4 text-right">
                            <button onclick="decommissionAgent('${agent.id}')" class="text-xs text-red-400 hover:text-red-300 px-2 py-1">Decommission</button>
                        </td>
                    `;
                    list.appendChild(row);
                });
            } catch (e) {
                console.error('Failed to load agents:', e);
            }
        }

        document.getElementById('reg-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const payload = Object.fromEntries(formData.entries());

            try {
                const res = await fetch(`${API_BASE}/agents/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (result.success) {
                    toggleModal(false);
                    e.target.reset();
                    loadAgents();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (e) {
                alert('Network Error');
            }
        };

        async function decommissionAgent(id) {
            if(!confirm('Are you sure?')) return;
            try {
                await fetch(`${API_BASE}/agents/${id}`, { method: 'DELETE' });
                loadAgents();
            } catch (e) {
                alert('Failed to decommission');
            }
        }

        // Initial Load
        loadAgents();
    </script>
</body>
</html>
